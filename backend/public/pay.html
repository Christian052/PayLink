<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Invoice</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 2rem; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #333; }
    .amount { font-size: 2rem; font-weight: bold; color: #2c3e50; margin: 1rem 0; }
    .details { color: #666; margin-bottom: 2rem; line-height: 1.5; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #444; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 1rem; background-color: #fbc531; color: #333; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #e1b12c; }
    .error { color: #e74c3c; margin-bottom: 1rem; display: none; }
    .success { color: #2ecc71; margin-bottom: 1rem; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading invoice details...</div>
    <div id="invoice-content" style="display: none;">
      <h1 id="business-name">Business Name</h1>
      <div class="amount" id="invoice-amount">0 RWF</div>
      <div class="details">
        <div><strong>To:</strong> <span id="buyer-name"></span></div>
        <div><strong>For:</strong> <span id="description"></span></div>
        <div style="margin-top: 0.5rem;"><strong>Status:</strong> <span id="status" style="padding: 2px 6px; border-radius: 4px; background: #eee;">PENDING</span></div>
      </div>

      <div id="payment-form-section">
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        <div class="form-group">
          <label for="phone">MoMo Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. 0780000000" required>
        </div>
        <button id="pay-btn">Pay via MoMo</button>
      </div>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const code = pathParts[pathParts.length - 1];

    async function loadInvoice() {
      try {
        const res = await fetch(`/api/invoices/${code}`);
        if (!res.ok) throw new Error('Invoice not found');
        const data = await res.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('invoice-content').style.display = 'block';
        
        document.getElementById('business-name').textContent = data.business_name;
        document.getElementById('invoice-amount').textContent = `${data.amount.toLocaleString()} ${data.currency}`;
        document.getElementById('buyer-name').textContent = data.buyer_name;
        document.getElementById('description').textContent = data.description || 'N/A';
        
        const statusEl = document.getElementById('status');
        statusEl.textContent = data.status;
        if (data.status === 'PAID') {
          statusEl.style.backgroundColor = '#2ecc71';
          statusEl.style.color = 'white';
          document.getElementById('payment-form-section').style.display = 'none';
        }
      } catch (err) {
        document.getElementById('loading').textContent = 'Error loading invoice. It may not exist.';
      }
    }

    document.getElementById('pay-btn').addEventListener('click', async () => {
      const phone = document.getElementById('phone').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const btn = document.getElementById('pay-btn');
      
      errorMsg.style.display = 'none';
      if (!phone) {
        errorMsg.textContent = 'Please enter your phone number';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await fetch(`/api/pay/${code}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Payment failed to initiate');

        successMsg.textContent = 'Payment initiated! Please check your phone for the MoMo prompt.';
        successMsg.style.display = 'block';
        document.querySelector('.form-group').style.display = 'none';
        btn.style.display = 'none';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Pay via MoMo';
      }
    });

    loadInvoice();
  </script>
</body>
</html>
